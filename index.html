<!DOCTYPE html>
<html lang="ja">
<head><script>window.SessionUI=(()=>{
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=p=>p.icon||(window.GameArt?GameArt.person(p.seat??p.id):'');
 const rows=players=>players.map(p=>`<button type="button" class="session-seat" data-seat="${esc(p.id)}" ${p.disabled?'disabled':''}><span class="session-face">${icon(p)}</span><span class="session-seat-copy"><b>${esc(p.name)}</b><small>${esc(p.status||(p.done?'確認済み':'タップして確認'))}</small></span><span class="session-chevron" aria-hidden="true">${p.done?'✓':'›'}</span></button>`).join('');
 let active=null;
 function viewport(){const v=visualViewport,r=document.documentElement;r.style.setProperty('--visible-h',(v?.height||innerHeight)+'px');r.style.setProperty('--visible-top',(v?.offsetTop||0)+'px');r.style.setProperty('--visible-left',(v?.offsetLeft||0)+'px');r.style.setProperty('--visible-w',(v?.width||innerWidth)+'px');r.classList.toggle('keyboard-open',!!document.activeElement?.matches('input:not([type=range]),textarea,[contenteditable=true]')&&(v?.height||innerHeight)<innerHeight*.82);}
 function dialog(title,note,body,actions=[]){
  return new Promise(resolve=>{
   const prior=document.activeElement,d=document.createElement('dialog');d.className='session-dialog';d.innerHTML=`<div class="session-dialog-head"><h2>${esc(title)}</h2><button type="button" class="session-close" aria-label="閉じる">×</button></div>${note?`<p class="session-note">${esc(note)}</p>`:''}<div class="session-dialog-body">${body}</div><div class="session-actions"></div>`;
   const finish=value=>{if(!d.isConnected)return;d.close();d.remove();active=null;resolve(value);if(prior?.isConnected)prior.focus({preventScroll:true});};
   d.querySelector('.session-close').onclick=()=>finish(null);d.addEventListener('cancel',e=>{e.preventDefault();finish(null)});for(const a of actions){const b=document.createElement('button');b.type='button';b.className=a.primary?'session-primary':'session-secondary';b.textContent=a.label;b.onclick=()=>a.action?a.action(d,finish):finish(a.value);d.querySelector('.session-actions').append(b)}
   d.sessionClose=finish;document.body.append(d);viewport();d.showModal();active=d;d.querySelector('.session-close').focus({preventScroll:true});
  });
 }
 async function confirm(name,note='本人以外は画面を見ないでください。'){
  return !!(await dialog(name+' さん本人ですか？',note,'<div class="session-cover" aria-hidden="true"><span>PRIVATE</span></div>',[{label:'一覧に戻る',value:false},{label:'本人です・内容を見る',value:true,primary:true}]));
 }
 async function pick({title='確認する人を選んでください',note='自分の名前をタップしてください。',players,confirmIdentity=true,cancel=true}){
  while(true){let pickId;
   await dialog(title,note,`<div class="session-roster">${rows(players)}</div>`,cancel?[{label:'閉じる',value:null}]:[]).then(v=>{pickId=v});
   if(pickId==null)return null;const p=players.find(x=>String(x.id)===String(pickId));if(!confirmIdentity||await confirm(p.name))return p.id;
  }
 }
 document.addEventListener('click',e=>{const b=e.target.closest('.session-dialog [data-seat]');if(b&&!b.disabled)b.closest('dialog').sessionClose(b.dataset.seat)});
 function mount(host,players,onSelect,title='自分の名前を選ぶ'){
  host.innerHTML=`<h2 class="session-roster-title">${esc(title)}</h2><p class="session-note">自分の名前をタップしてから、本人確認をします。</p><div class="session-roster">${rows(players)}</div>`;
  host.querySelectorAll('[data-seat]').forEach(b=>b.onclick=async()=>{if(b.disabled)return;const p=players.find(x=>String(x.id)===b.dataset.seat);if(await confirm(p.name))onSelect(p.id)});
 }
 function portal(){for(const id of ['dialogOverlay','peekOverlay','resumeGate','resumeOverlay','inAppConfirm','ov','portraitDialog']){const e=document.getElementById(id);if(e&&e.parentElement!==document.body)document.body.append(e)}document.querySelectorAll('.confirm-layer,.modal-layer,.app-confirm-overlay').forEach(e=>{if(e.parentElement!==document.body)document.body.append(e)});}
 function init(){viewport();portal();new MutationObserver(portal).observe(document.body,{childList:true,subtree:true});document.addEventListener('focusin',viewport);document.addEventListener('focusout',()=>setTimeout(viewport,100));window.addEventListener('resize',viewport);visualViewport?.addEventListener('resize',viewport);visualViewport?.addEventListener('scroll',viewport);const dock=document.getElementById('dockHost');if(dock){const resize=new ResizeObserver(()=>document.documentElement.style.setProperty('--live-dock-height',dock.getBoundingClientRect().height+'px'));resize.observe(dock);}}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
 return{esc,rows,mount,pick,confirm,dialog,viewport};
})();
</script>
<script>/* Short material sounds. No melodic fanfares; all effects decay within 450 ms. */
window.TableSound=(()=>{
 const P={"hit": 135, "rub": 1700, "note": 280};
 let ac=null,lastTap=-1;const voices=new Set(),guards=[];
 function context(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C()}if(ac.state==='suspended')ac.resume().catch(()=>{});return ac}catch{return null}}
 function track(node,g){voices.add(node);node.onended=()=>{voices.delete(node);node.disconnect();g.disconnect()}}
 function stop(){for(const node of voices)try{node.stop()}catch{}voices.clear()}
 function modal(f,d,v,at=0){const c=context();if(!c)return;const t=c.currentTime+at;[[1,1],[2.76,.2],[4.8,.055]].forEach(([ratio,amp])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*ratio;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v*amp),t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+d/Math.sqrt(ratio));o.connect(g);g.connect(c.destination);track(o,g);o.start(t);o.stop(t+d+.01)})}
 function friction(d,f,v,at=0){const c=context();if(!c)return;const t=c.currentTime+at,len=Math.ceil(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),data=b.getChannelData(0);let previous=0;for(let i=0;i<len;i++){previous=.65*previous+.35*(Math.random()*2-1);data[i]=previous*Math.sin(Math.PI*i/len)**1.4}const src=c.createBufferSource(),filter=c.createBiquadFilter(),g=c.createGain();src.buffer=b;filter.type='bandpass';filter.frequency.value=f;filter.Q.value=.65;g.gain.value=v;src.connect(filter);filter.connect(g);g.connect(c.destination);voices.add(src);src.onended=()=>{voices.delete(src);src.disconnect();filter.disconnect();g.disconnect()};src.start(t)}
 function pluck(f,d,v,at=0){const c=context();if(!c)return;const t=c.currentTime+at;[1,2,3,4].forEach((h,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*h;g.gain.setValueAtTime(v/(h*h),t);g.gain.exponentialRampToValueAtTime(.0001,t+d/(1+i*.4));o.connect(g);g.connect(c.destination);track(o,g);o.start(t);o.stop(t+d+.01)})}
 function play(kind){if(document.hidden)return;const c=context();if(!c)return;if(kind==='tap'){if(c.currentTime-lastTap<.045)return;lastTap=c.currentTime;friction(.025,P.rub,.065);modal(P.hit,.045,.025);return}
  if(kind==='paper'){friction(.13,P.rub,.18);friction(.04,P.rub*.6,.08,.09);return}
  if(kind==='tick'){modal(P.hit*1.65,.035,.022);return}
  if(kind==='place'){friction(.035,P.rub*.55,.13);modal(P.hit,.09,.05);return}
  if(kind==='fail'||kind==='timeup'){modal(P.hit*.7,.16,.055);friction(.055,450,.13,.025);return}
  if(kind==='reveal'){friction(.18,P.rub,.15);modal(P.hit,.12,.035,.1);return}
  if(kind==='confirm'){friction(.05,P.rub,.1);modal(P.hit,.12,.045,.035);return}
  friction(.07,P.rub*.7,.14);modal(P.hit*.8,.075,.024,.02);
 }
 function install(object,allowed,mapping){guards.push(allowed);for(const [name,kind]of Object.entries(mapping))object[name]=()=>{if(allowed())play(kind)};for(const name of ['toggle','setEnabled','setPrivate','stop','drumStop']){if(typeof object[name]!=='function')continue;const old=object[name];object[name]=function(...args){stop();return old.apply(this,args)}}}
 new MutationObserver(()=>{if(guards.some(allowed=>!allowed()))stop()}).observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class','hidden']});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);
 return{play,stop,install};
})();
</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<style>
/* ===== variables.css (original) ===== */
:root{--tw:min(20vmin,16vh);
  --headerFill:#e05b2b;--headerTextColor:#ffffff;
  --headerFont:"Germania One","Dela Gothic One",cursive;
  --backgroundLight:#4d4945;--backgroundDark:#372e25;
  --textFont:Montserrat,"M PLUS 1p","Hiragino Sans","Noto Sans JP",sans-serif;
  --textColorOnWhite:#69645e;--textColorOnDark:#bbbbbb;--textColorHighlight:var(--headerFill);
  --textColorLiberal:#5a9ba6;--textColorWhite:#ffffff;--textShadowed:#141414;
  --buttonFill:var(--headerFill);--buttonShadowFill:#b4431a;--buttonHoverFill:#e67a53;
  --buttonDisabledFill:#928079;--buttonDisabledShadowFill:#766058;
  --alertFill:#141414;--alertOverlayOpacity:0.8;
  --playerBrightnessFilter:40%;--playerDisabledTextColor:#999999;
  --selectionHover:rgba(246,181,63,1);--selectionPressed:rgba(205,135,9,1);--selectionNone:rgba(246,181,63,0);
  --eventBarIn:1s;--eventBarOut:1s;--eventBarOpacity:0.9;
  --etOffset:17.6%;--etSpacing:19.14%;--etDuration:1.5s;
}
/* Prevent pull-to-refresh while a game is active; keep normal page scrolling. */
html.game-in-progress,html.game-in-progress body{overscroll-behavior-y:none}
/* ===== App.css ===== */
html,body{margin:0;padding:0;overflow-x:hidden;background-color:var(--backgroundLight)}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
div{text-align:center}
header{background-color:#E05B2B;min-height:6vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-top:calc(1vh + env(safe-area-inset-top));font-size:calc(12px + 4vmin);font-family:var(--headerFont);color:var(--headerTextColor)}
h1{font-size:calc(12px + 3.5vmin);font-family:var(--headerFont);color:var(--headerTextColor);font-weight:normal;font-style:italic}
h2{font-size:calc(12px + 2vmin);font-family:var(--headerFont);color:var(--headerTextColor);font-weight:normal;font-style:normal;margin-block-start:.5em;margin-block-end:.5em}
p{font-family:var(--textFont);font-weight:700;font-size:calc(12px + 1vmin);color:var(--textColorOnDark)}
a{font-family:var(--textFont);font-size:calc(12px + 1vmin);color:var(--buttonHoverFill);cursor:pointer}
.highlight{color:var(--textColorHighlight)}
.highlight-blue{color:var(--textColorLiberal)}
button{background:transparent;border:2px solid transparent;box-sizing:border-box;cursor:pointer;font-size:calc(6px + 4vmin);font-family:var(--headerFont);
  color:var(--headerTextColor);background:var(--buttonFill);line-height:1;margin:18px;padding:10px 25px;text-align:center;text-decoration:none;
  display:inline-block;outline:none;position:relative;border-radius:10px;top:0;transition:all .15s ease-in-out 0s,visibility 0s;
  box-shadow:0 5px 0 var(--buttonShadowFill);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media(hover:hover){button:hover{background:var(--buttonHoverFill)}}
button:focus-visible{background:var(--buttonHoverFill)}
button:not(:disabled):active{top:5px;background:var(--buttonFill);box-shadow:0 0 0 var(--buttonShadowFill)}
button:disabled{box-shadow:0 5px 0 var(--buttonDisabledShadowFill);background:var(--buttonDisabledFill);cursor:not-allowed}
input{font-family:var(--textFont);width:40vmin;min-width:20px;font-size:max(16px,calc(4px + 3vmin));color:var(--textColorOnWhite);border-radius:5px;padding:5px;border:2px solid transparent;outline:none}
input::placeholder{color:var(--textColorOnDark)}
#snackbar{visibility:hidden;min-width:30vw;background-color:var(--alertFill);display:inline-block;color:var(--headerTextColor);font-family:var(--textFont);
  font-size:calc(10px + 2vmin);border-radius:10px;padding:16px;position:fixed;z-index:100;bottom:30px;left:50%;transform:translateX(-50%)}
#snackbar.show{visibility:visible;animation:fadein .5s,fadeout .5s 2.5s}
@keyframes fadein{from{bottom:0;opacity:0;visibility:visible}to{bottom:30px;opacity:1;visibility:visible}}
@keyframes fadeout{from{bottom:30px;opacity:1;visibility:visible}to{bottom:0;opacity:0;visibility:hidden}}
#victory-header{width:100%}
.left-align{text-align:left}

/* ===== selectable.css ===== */
.selectable{background-color:var(--selectionNone);cursor:pointer;-webkit-tap-highlight-color:transparent}
.selectable.selected{background-color:var(--selectionPressed)}
@media(hover:hover){.selectable:hover{background-color:var(--selectionHover)}}
.selectable:active{background-color:var(--selectionPressed)}

/* ===== Board.css ===== */
.board-container{display:flex;flex-direction:column}
.board-group{margin:4px 10px;position:relative}
.board{min-width:40vmin;width:90vmin;max-width:90vw;display:block}
.policy{position:absolute;width:10%;top:30%;image-rendering:pixelated}
.policy.hide{visibility:hidden}
.policy.show{transition-timing-function:ease-in-out;visibility:visible;animation:appear 1s,drop .3s 1s}
.policy.static{visibility:visible}
@keyframes appear{0%{opacity:0;top:10%}100%{opacity:1;top:10%}}
@keyframes drop{0%{top:10%}100%{top:30%}}
#election-tracker{transition:1s left;transition-timing-function:ease-in-out}

/* ===== Deck.css ===== */
.deck-container{width:14vmin;height:fit-content;position:relative}
.deck-base{width:14vmin;height:auto;display:block}
.deck-card-count{font-size:3.5vmin;position:absolute;color:var(--textColorWhite);left:30%;top:58%;text-align:center;width:40%;margin:0;z-index:2}
.deck-policy{position:absolute;width:69%;opacity:1}
.deck-policy.deck-final-show,.deck-policy.deck-transition-show{transition:.4s top ease-in,.2s opacity;opacity:1;left:16%}
.deck-policy.deck-final-hide,.deck-policy.deck-transition-hide{transition:.2s .3s opacity,.5s left ease-in;opacity:0;left:-30%}

/* ===== Player.css ===== */
.player-container{position:relative;margin:5px;border-radius:16%/10%;-webkit-user-select:none;user-select:none}
.player-container.highlight{background-color:var(--selectionHover)}
.player-icon{position:absolute;width:82%;left:9%;top:6.3%;user-select:none;pointer-events:none}
.player-icon.darken{filter:brightness(calc(var(--playerBrightnessFilter) - 5%))}
.player-image{width:var(--tw);max-width:none;height:auto;image-rendering:crisp-edges;display:block;pointer-events:none}
.player-image.darken{filter:brightness(calc(var(--playerBrightnessFilter) - 5%))}
.player-name{position:absolute;color:var(--backgroundDark);font-family:var(--textFont);font-weight:700;top:64%;left:10%;width:80%;height:16%;
  display:flex;align-items:center;justify-content:center;line-height:1.05;overflow:hidden;word-break:break-all;user-select:none}
.player-name.darken{color:var(--textShadowed)}
.player-identity-icon{position:absolute;top:75%;left:8%;width:28%;user-select:none}
.player-busy-icon{position:absolute;top:43%;left:50%;width:37.5%}
.player-icon-vote{position:absolute;width:73%;image-rendering:crisp-edges;top:43%;left:14%;transition:.5s visibility}
.player-identity-label{position:absolute;top:75%;left:37%;width:52%;height:calc(var(--tw)*.28);display:flex;align-items:center;white-space:nowrap;overflow:hidden;font-weight:700;color:var(--textColorHighlight);
  font-family:var(--textFont);margin:0;line-height:1;user-select:none}
.player-identity-label.liberal-text{color:var(--textColorLiberal)}
.player-disabled-label{position:absolute;top:0;left:0;font-family:var(--headerFont);color:var(--playerDisabledTextColor);padding:15% 4%;height:100%;width:100%;overflow-wrap:anywhere;
  font-size:calc(var(--tw)*.16);font-weight:normal;margin:0;box-sizing:border-box;user-select:none}
.darken{filter:brightness(var(--playerBrightnessFilter))}
.player-icon-default{visibility:hidden}
.player-icon-show{visibility:visible;animation:player-icon-show .5s}
.player-icon-hide{visibility:hidden;animation:player-icon-hide .5s}
@keyframes player-icon-show{0%{top:35%;opacity:0;visibility:visible}100%{top:43%;opacity:1}}
@keyframes player-icon-hide{0%{top:43%;opacity:1;visibility:visible}100%{top:43%;opacity:0;visibility:hidden}}

/* ===== PlayerDisplay.css ===== */
.player-display{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:10px}
.player-display-container{display:flex;flex-direction:row}
.player-display-text-container{display:inline-block;width:min-content;margin-top:auto}
.player-display-label{display:inline-block;width:15vmin;font-size:calc(4px + 3vmin);font-weight:normal;font-family:var(--headerFont);color:var(--textColorWhite);margin:0 auto}

/* ===== CustomAlert.css ===== */
#alert{position:fixed;inset:0;width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;visibility:hidden;z-index:75}
#alert-background{position:fixed;width:100%;height:110%;min-height:100%;top:0;left:0;margin:0;z-index:50;box-sizing:border-box;background-color:var(--alertFill);opacity:var(--alertOverlayOpacity)}
#alert-box{position:relative;z-index:60;opacity:1;min-width:80vmin;max-width:40vw;min-height:60vmin;padding:20px 30px;background-color:var(--alertFill);text-align:center;
  margin:10vh auto 10px;width:max-content;box-sizing:content-box}
@media(max-width:700px){#alert-box{max-width:calc(100vw - 60px);width:auto;margin-left:auto;margin-right:auto}}
.appear-custom-alert{animation:appear-custom-alert .5s;visibility:visible!important;transition:visibility .5s;opacity:1}
.disappear-custom-alert{animation:disappear-custom-alert 1s;visibility:hidden;transition:visibility .5s}
@keyframes appear-custom-alert{0%{opacity:0}40%{opacity:0}100%{opacity:1}}
@keyframes disappear-custom-alert{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
#alert-background.appear-custom-alert{animation:appear-background .5s;opacity:var(--alertOverlayOpacity)}
#alert-background.disappear-custom-alert{animation:disappear-background 1s}
@keyframes appear-background{0%{opacity:0;visibility:visible}50%{opacity:var(--alertOverlayOpacity)}}
@keyframes disappear-background{0%{opacity:var(--alertOverlayOpacity);visibility:visible}40%{opacity:var(--alertOverlayOpacity);visibility:visible}100%{opacity:0;visibility:hidden}}
#alert-box::after{content:"";display:block;clear:both}

/* ===== VotingPrompt.css ===== */
#alert-box .float-player .player-container{float:left;display:inline;margin:5px 10px 5px 5px}
.vote-mode{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:12px 0 4px}.vote-mode>span{font-weight:700}.vote-mode small{flex-basis:100%;opacity:.8;font-size:calc(9px + 1vmin)}
.seg{display:inline-flex;border-radius:10px;overflow:hidden;border:2px solid var(--textColorHighlight,#f7e2c0)}.seg button{margin:0;border-radius:0;box-shadow:none;min-width:0;padding:8px 14px;background:transparent;color:inherit;top:0}.seg button.on{background:var(--textColorHighlight,#f7e2c0);color:#222}
.bv-list{display:flex;flex-direction:column;gap:6px;margin:10px 0;clear:both}.bv-row{display:grid;grid-template-columns:44px 1fr auto auto;align-items:center;gap:8px;background:rgba(0,0,0,.25);border-radius:10px;padding:5px 8px}
.bv-face{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#2a231d}.bv-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bv-name{color:#f7e2c0}.bv-b{margin:0!important;min-width:4.6em;padding:8px 10px;background:#3b342e!important;color:#a99d8c!important;box-shadow:0 4px 0 #1e1a16!important}.bv-b.ja.on{background:#e8d6b0!important;color:#2a2018!important;box-shadow:0 4px 0 #9c8a64!important}.bv-b.nein.on{background:#2b2622!important;color:#f7e2c0!important;outline:2px solid #f7e2c0}.bv-row:has(.on){background:rgba(247,226,192,.12)}
.bv-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.bv-acts button{margin:6px 0}
.voting-card-container{display:flex;width:100%;align-content:center;clear:both}
.voting-card{width:30vmin;border-radius:8%/11%;margin:10px auto}
/* ===== RoleAlert.css ===== */
.role-banner{display:flex;align-items:center;justify-content:center;gap:.5em;margin:-20px -30px 14px;padding:12px 10px;font-family:var(--headerFont);font-size:clamp(20px,calc(10px + 3vmin),40px);color:#fff;letter-spacing:.06em}
.role-banner small{font-family:var(--textFont);font-size:.55em;font-weight:700;opacity:.9;letter-spacing:0}
.role-banner.team-L{background:linear-gradient(90deg,#2d6f86,#4a9cc0,#2d6f86)}
.role-banner.team-F{background:linear-gradient(90deg,#8e2414,#d2462a,#8e2414)}
.role-wrap{border-radius:4px}
.role-wrap.team-L{box-shadow:0 0 0 4px #4a9cc0 inset;}
.role-wrap.team-L #alert-header,.role-name-L{color:#6fc3e6!important}
.role-wrap.team-F #alert-header,.role-name-F{color:#ff6a45!important}
#role{width:25vmin;height:auto;display:inline;float:left;align-self:center;margin:10px 2vmin 10px 10px}
/* ===== PolicyDisplay.css ===== */
.legislative-policy-container{clear:both}
.legislative-policy{width:20vmin;margin:10px;border-radius:8%/6%}
.legislative-button-container{display:flex;flex-direction:row;justify-content:center;width:100%}
/* ===== PolicyEnactedAlert.css ===== */
#policy-enacted-container{display:flex;width:20vmin;height:26vmin;margin:auto auto;position:relative;perspective:1000px}
#policy-enacted-cover-front,#policy-enacted-cover-back{position:absolute;width:auto;height:26vmin;z-index:54;transition-timing-function:linear;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;left:-99.5%;top:0;transition:1s transform ease,.5s left ease-in-out}
#policy-enacted-cover-front.show-policy-shift{left:-49.5%}
#policy-enacted-cover-front.show-policy-flip{transform:rotateY(-180deg);z-index:53}
#policy-enacted-cover-back{transform:rotateY(180deg)}
#policy-enacted-cover-back.show-policy-shift{left:-49.5%}
#policy-enacted-cover-back.show-policy-flip{transform:rotateY(0deg)}
#policy-enacted-back{position:absolute;width:auto;height:26vmin;z-index:51;left:-100%;transition:.5s left;transition-timing-function:ease-in-out}
#policy-enacted-back.show-policy-shift{left:-50%}
#policy-enacted-policy{position:absolute;width:auto;height:100%;left:-7.5%;z-index:52;transition:.5s left;transition-timing-function:ease-in-out}
#policy-enacted-policy.show-policy-shift{left:42.5%}
/* ===== ElectionTrackerAlert.css ===== */
#election-tracker-container{position:relative;width:100%}
#election-tracker-board{width:100%;display:block}
#election-tracker-token{position:absolute;width:7.5%;top:47%;left:calc(17.6% + 2*19.1%);animation-timing-function:linear}
#election-tracker-token.et-position-0{left:var(--etOffset)}
#election-tracker-token.et-moveto-1{left:calc(var(--etOffset) + 1*var(--etSpacing));animation:et-moveto-1 var(--etDuration)}
#election-tracker-token.et-position-1{left:calc(var(--etOffset) + 1*var(--etSpacing))}
#election-tracker-token.et-moveto-2{left:calc(var(--etOffset) + 2*var(--etSpacing));animation:et-moveto-2 var(--etDuration)}
#election-tracker-token.et-position-2{left:calc(var(--etOffset) + 2*var(--etSpacing))}
#election-tracker-token.et-moveto-3{left:calc(var(--etOffset) + 3*var(--etSpacing));animation:et-moveto-3 var(--etDuration)}
@keyframes et-moveto-1{0%{left:var(--etOffset)}100%{left:calc(var(--etOffset) + var(--etSpacing))}}
@keyframes et-moveto-2{0%{left:calc(var(--etOffset) + var(--etSpacing))}100%{left:calc(var(--etOffset) + 2*var(--etSpacing))}}
@keyframes et-moveto-3{0%{left:calc(var(--etOffset) + 2*var(--etSpacing))}100%{left:calc(var(--etOffset) + 3*var(--etSpacing))}}
/* ===== InvestigationAlert.css ===== */
#investigation-text{transition:.5s opacity}
#investigation-text.investigation-text-hide{opacity:0}
#investigation-text.investigation-text-show{opacity:1}
#party-card-container,#party-card-back,#party-card-front{width:28vmin;height:40vmin}
#party-card-container{margin:auto auto;position:relative;perspective:1000px;display:flex}
#party-card-back,#party-card-front{backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:1.5s transform ease;top:0;left:0;position:absolute}
#party-card-back.investigation-container-default{z-index:51}
#party-card-back.investigation-container-flip{transform:rotateY(180deg);z-index:50}
#party-card-front.investigation-container-default{transform:rotateY(180deg);z-index:50}
#party-card-front.investigation-container-flip{transform:rotateY(360deg);z-index:51}
/* ===== StatusBar.css ===== */
#status-bar{background-color:var(--alertFill);min-height:8vmin}
#status-bar-text{margin:0;padding:2vmin 5px;color:var(--textColorWhite);animation:show .25s}
@keyframes show{0%{opacity:0}100%{opacity:1}}
/* ===== EventBar.css ===== */
#event-bar{width:100%;top:30%;position:fixed;align-items:center;display:flex;justify-content:center;text-align:center;visibility:hidden;z-index:48;transition:visibility var(--eventBarIn)}
#bar-background{width:100%;min-height:15vmin;background-color:var(--alertFill);z-index:48;animation:ease-in-out}
#event-bar-text{position:absolute;z-index:49;display:flex;font-style:italic;margin:0 auto;animation:ease-out;opacity:0}
#event-bar.start-eventbar{visibility:hidden}
#event-bar.appear-eventbar{visibility:visible;transition:visibility 0s}
#bar-background.appear-eventbar{visibility:visible;transition:0s;animation:appear-bar var(--eventBarIn);opacity:var(--eventBarOpacity)}
#event-bar-text.appear-eventbar{visibility:visible;transition:visibility 0s;animation:appear-text var(--eventBarIn);opacity:1}
#event-bar.disappear-eventbar{visibility:hidden;transition:visibility var(--eventBarOut)}
#bar-background.disappear-eventbar{visibility:hidden;transition:visibility var(--eventBarOut);animation:disappear-bar var(--eventBarOut)}
#event-bar-text.disappear-eventbar{visibility:hidden;transition:visibility var(--eventBarOut);animation:disappear-text var(--eventBarOut)}
@keyframes appear-text{0%{opacity:0;padding-top:20px}60%{opacity:0;padding-top:20px}100%{opacity:1;padding-top:0}}
@keyframes appear-bar{0%{opacity:0;width:0}60%{opacity:var(--eventBarOpacity);width:100%}}
@keyframes disappear-text{0%{opacity:1;visibility:visible}40%{opacity:0;visibility:hidden}60%{opacity:0;visibility:hidden}}
@keyframes disappear-bar{0%{opacity:var(--eventBarOpacity);visibility:visible}60%{opacity:var(--eventBarOpacity);visibility:visible}100%{opacity:0;visibility:hidden}}
/* ===== PlayerPolicyStatus.css ===== */
#pps-container{padding:10px;background-color:var(--backgroundDark);margin:10px;border-radius:4%/6%}
.pps-icon-container{display:flex;align-items:center}
.pps-icon{width:5vmin;height:5vmin;margin-left:3px}
.pps-icon-number{margin-bottom:0;margin-top:0}
.pps-text{text-align:left;font-size:max(9px,2vmin);margin-bottom:0;margin-top:0;color:var(--textColorWhite)}
/* ===== Lobby (1台版) ===== */
.lobby{text-align:left;margin:0 20px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.lobby .row{display:flex;flex-direction:row;align-items:center;text-align:left;flex-wrap:wrap}
.lobby .row button{margin:10px 12px}
#lobby-player-container{display:flex;flex-wrap:wrap;justify-content:flex-start;background:var(--backgroundDark);border-radius:10px;padding:8px;min-height:22vmin}
#lobby-player-container .player-container{cursor:pointer}
#lobby-name-list{background:var(--backgroundDark);border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 16px}
.lobby-name-row{display:flex;align-items:center;gap:10px}
.lobby-num{font-family:var(--fontHeader, 'Germania One'),sans-serif;color:var(--textColorHighlight);min-width:1.4em;text-align:right;font-size:calc(14px + 1vmin)}
.lobby-icon{width:calc(34px + 3vmin);height:calc(34px + 3vmin);object-fit:cover;border-radius:6px;cursor:pointer;background:#2a231d;flex:none}
.lobby-name-row input{flex:1;min-width:0;margin:4px 0}
.lobby-buttons{text-align:center}
.icon-grid{display:flex;flex-wrap:wrap;justify-content:center;clear:both}
.icon-grid img{width:16vmin;max-width:84px;margin:4px;border-radius:12%;cursor:pointer}
.icon-grid img.taken{filter:brightness(35%);cursor:not-allowed}
.rules p{font-weight:500;text-align:left;margin:.5em 0}
.rules h2{text-align:left;margin-top:1em}
.game-extra{text-align:center;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.game-extra a{font-size:calc(10px + 1vmin)}

/* ===== 端末最適化（SP/TB） ===== */
html{-webkit-tap-highlight-color:transparent}
button,a,.selectable,.lobby-icon,[data-pick],[data-v]{touch-action:manipulation}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
#app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
.lobby{max-width:820px;margin-left:auto;margin-right:auto;padding-left:16px;padding-right:16px}
.lobby button{font-size:clamp(18px,calc(6px + 4vmin),34px)}
.lobby h2{font-size:clamp(18px,calc(12px + 2vmin),30px)}
.lobby p{font-size:clamp(12px,calc(12px + 1vmin),18px)}
.lobby-name-row input{font-size:clamp(16px,calc(4px + 3vmin),22px)}
.lobby-icon{width:clamp(36px,calc(34px + 3vmin),56px);height:clamp(36px,calc(34px + 3vmin),56px)}
@media (max-width:430px){#lobby-name-list{grid-template-columns:1fr}}
/* 横向き（スマホ横・タブレット横）はボードを左右に並べてスクロールを減らす */
@media (orientation:landscape) and (min-aspect-ratio:4/3){
 .board-container{flex-direction:row;justify-content:center;flex-wrap:wrap}
 .board{width:min(46vw,90vmin);min-width:0}
}
@media (orientation:landscape) and (max-height:500px){
 #alert-box{margin-top:12px;min-height:0}
 :root{--tw:min(14vmin,14vh)}
}

/* ---- back / sound ---- */
body:not(.has-back) [data-back]{display:none!important}
.bk-in{float:right;font-size:calc(9px + 1.8vmin);padding:7px 14px;margin:6px 0 10px 12px;box-shadow:0 4px 0 var(--buttonShadowFill)}
.bk-in::before{content:"← "}
#bk{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,20,20,.82)}
#bk.open{display:flex}
#bk .box{background:var(--alertFill);border-radius:10px;padding:18px 22px 6px;max-width:min(440px,calc(100vw - 40px));box-shadow:0 10px 40px rgba(0,0,0,.6)}
#bk h2{margin:4px 0 6px}
#bk p{margin:8px 0;line-height:1.6}
#bk button{margin:14px 8px;font-size:calc(8px + 3vmin)}
#bk [data-n]{background:var(--buttonDisabledFill);box-shadow:0 5px 0 var(--buttonDisabledShadowFill)}
.vote-mode>span{color:var(--textColorOnDark,#bbb)!important}
.vote-mode small{color:var(--textColorOnDark,#bbb)!important;opacity:1!important}
.seg{border:2px solid var(--buttonFill,#e05a2b)!important;border-radius:10px}
.seg button{color:var(--textColorOnDark,#bbb)!important;background:#3b342e!important}
.seg button.on{background:var(--buttonFill,#e05a2b)!important;color:var(--headerTextColor,#fff)!important}
</style>

<script>

 polF:A('policy-fascist.png'),fBack:A('policy-folder-back.png'),fCB:A('policy-folder-cover-back.png'),fCF:A('policy-folder-cover-front.png'),
 party:A('party-membership.png'),partyL:A('party-membership-liberal.png'),partyF:A('party-membership-fascist.png'),
 roleH:[A('role-hitler.png')],roleF:[1,2,3].map(i=>A(`role-fascist-${i}.png`)),roleL:[1,2,3,4,5,6].map(i=>A(`role-liberal-${i}.png`)),
 vicF:A('victory-fascist-header.png'),vicL:A('victory-liberal-header.png'),voteYes:A('vote-yes.png'),voteNo:A('vote-no.png')};
// preload
Object.values(IMG).flat().forEach(s=>{const i=new Image();i.src=s});

const KEY='sho-ja.game.v1',LKEY='sho-ja.lobby.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const SPEED=()=>window.__SPEED||1;
let GEN=0;
const wait=ms=>{const g=GEN;return new Promise(r=>setTimeout(()=>{if(g===GEN)r()},ms*SPEED()))};
const sp=()=>SPEED();let muted=false;try{muted=localStorage.getItem('sho-ja.muted')==='1'}catch(e){}
let ac=null,MIX=null;
const AC=()=>{if(muted||sp()<.5)return null;try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();MIX=null}if(ac.state==='suspended')ac.resume();if(!MIX)buildMix(ac);return ac}catch(e){return null}};
function buildMix(a){
 const comp=a.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=3.5;comp.attack.value=.004;comp.release.value=.25;
 const master=a.createGain();master.gain.value=.9;master.connect(comp);comp.connect(a.destination);
 // generated hall impulse (stereo, smooth decay, darkened tail)
 const len=Math.floor(a.sampleRate*2.6),ir=a.createBuffer(2,len,a.sampleRate);
 for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);let lp=0;for(let i=0;i<len;i++){const t=i/len;lp+=(Math.random()*2-1-lp)*(0.5-0.42*t);d[i]=lp*Math.pow(1-t,3.2)*(i<a.sampleRate*.012?i/(a.sampleRate*.012):1)}}
 const verb=a.createConvolver();verb.buffer=ir;const vg=a.createGain();vg.gain.value=.55;

 MIX={master,send:hp};

// route a node: dry to master + reverb send, with optional pan
function out(node,wet=.35,pan=0){const a=ac;let n=node;if(pan&&a.createStereoPanner){const p=a.createStereoPanner();p.pan.value=pan;n.connect(p);n=p}
 n.connect(MIX.master);if(wet>0){const s=a.createGain();s.gain.value=wet;n.connect(s);s.connect(MIX.send)}}

function tone(f,d=.15,v=.05,t='sine',at=0,o2={}){const a=AC();if(!a)return;try{const n=a.currentTime+at,g=a.createGain();
 const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=o2.lp||(t==='sine'?12000:Math.min(9000,f*7));lp.Q.value=.4;
 [-(o2.det??4),(o2.det??4)].forEach(dt=>{const o=a.createOscillator();o.type=t;o.frequency.value=f;o.detune.value=dt;if(o2.glide)o.frequency.exponentialRampToValueAtTime(o2.glide,n+d);o.connect(lp);o.start(n);o.stop(n+(o2.atk||.008)+d+.05)});

 noise(.025,v*.6,f*4,at,{q:2,wet:.2,pan})}catch(e){}}

 const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=o2.type||'bandpass';f.frequency.setValueAtTime(fq,n);if(o2.to)f.frequency.exponentialRampToValueAtTime(o2.to,n+d);f.Q.value=o2.q??.9;

/* ---------------- game logic ---------------- */
const aliveCount=()=>S.players.filter(p=>p.alive).length;
const nextAlive=i=>{const n=S.players.length;for(let k=1;k<=n;k++){const j=(i+k)%n;if(S.players[j].alive)return j}return i};
function reshuffleIfNeeded(){if(S.deck.length<3){S.deck=shuffle(S.deck.concat(S.discard));S.discard=[]}}
function advancePres(){
 if(S.seNext!=null){S.pres=S.seNext;S.seNext=null}else{S.rot=nextAlive(S.rot);S.pres=S.rot}
 S.chan=null;S.votes={};S.vetoOccurred=false;S.state='NOMINATION';S.firstNom=false;
}
function powerFor(f){const n=S.players.length;const t=n<=6?[null,null,'PP_PEEK','PP_EXEC','PP_EXEC',null]:n<=8?[null,'PP_INV','PP_SE','PP_EXEC','PP_EXEC',null]:['PP_INV','PP_INV','PP_SE','PP_EXEC','PP_EXEC',null];return t[f-1]}
function newGame(){
 const n=L.players.length,f=n<=6?1:n<=8?2:3,l=n-f-1;
 const roles=shuffle(['H',...Array(f).fill('F'),...Array(l).fill('L')]);const r=rnd(n);
 S={players:L.players.map((p,i)=>({name:p.name,icon:p.icon,role:roles[i],alive:true,inv:false})),deck:shuffle([...Array(6).fill('L'),...Array(11).fill('F')]),discard:[],
  lib:0,fas:0,tracker:0,pres:r,rot:r,chan:null,lastPres:null,lastChan:null,seNext:null,votes:{},vetoOccurred:false,state:'ROLES',k:0,
  presChoices:null,chanChoices:null,target:null,winType:null,firstNom:true,voteMode:L.vote==='secret'?'secret':'open'};
 D={lib:0,fas:0,tracker:0,draw:17,discard:0};
 H=[{label:'ロビー',sig:'lobby',lobby:true}];saveH();
}
async function enact(card,chaos){
 if(card==='L')S.lib++;else S.fas++;
 S.lastPolicy=card;S.vetoOccurred=false;S.chanChoices=null;S.presChoices=null;
 reshuffleIfNeeded();
 const pw=!chaos&&card==='F'?powerFor(S.fas):null;
 if(S.lib>=5){S.state='VICTORY';S.winType='LIB_POLICY'}
 else if(S.fas>=6){S.state='VICTORY';S.winType='FAS_POLICY'}
 else if(pw)S.state=pw;
 else if(chaos)advancePres();
 else S.state='POST';
 S.pendingEnact=card;save();
 await showEnact();
}
async function showEnact(){
 const card=S.pendingEnact;if(!card)return;
 await policyEnactedAlert(card);
 D.lib=S.lib;D.fas=S.fas;D.tracker=S.tracker;updateBoard();renderPlayers();await wait(500);await syncDecks();
 S.pendingEnact=null;save();
}
async function chaos(){
 // tracker reached 3
 S.tracker=0;S.lastPres=null;S.lastChan=null;
 if(S.deck.length<1)reshuffleIfNeeded();
 const card=S.deck.shift();sfx.chaos();
 await enact(card,true);
}
async function showVotes(){
 setStatus('投票を集計中...');
 await wait(1000);
 const order=S.players.map((_,i)=>i),dur=1000/order.length;
 votesShown=0;renderPlayers();
 sfx.flip();
 for(let k=1;k<=order.length;k++){await wait(dur);votesShown=k;renderPlayers()}
 await wait(Math.max(0,1000-1000));
 const vals=Object.values(S.votes),y=vals.filter(v=>v).length,n=vals.length-y;
 setStatus(`${y} - ${n}：${y>n?'可決':'否決'}`);y>n?sfx.good():sfx.bad();
 await wait(4000);
 votesShown=-1;renderPlayers();setStatus('');await wait(500);
}
async function victory(){
 const fas=S.players.map((_,i)=>i).filter(i=>P(i).role!=='L'),lib=S.players.map((_,i)=>i).filter(i=>P(i).role==='L');
 const t=S.winType,fw=t==='FAS_POLICY'||t==='FAS_ELECTION';
 const msg={FAS_POLICY:'ファシストが6枚の政策を制定しました！',FAS_ELECTION:'ファシストがヒトラーを首相に選出しました！',LIB_POLICY:'リベラルが5枚の政策を制定しました！',LIB_EXEC:'リベラルがヒトラーを処刑しました！'}[t];
 setStatus(fw?'ファシストの勝利':'リベラルの勝利');renderPlayers();setTimeout(fw?sfx.doom:sfx.fanfare,300*SPEED());
 await showAlert(buttonPrompt({labelHTML:`<img src="${fw?IMG.vicF:IMG.vicL}" id="victory-header" alt="${fw?'ファシストの勝利':'リベラルの勝利'}"><p style="text-align:center" class="${fw?'highlight':'highlight-blue'}">${msg}</p>`,
  body:playerDisplay({players:fw?fas.concat(lib):lib.concat(fas),filter:F_NONE,showLabels:false,viewer:null}),buttons:'<button data-ok>ロビーに戻る</button>'}),(box,close)=>{box.querySelector('[data-ok]').onclick=()=>close(true)});
 S=null;H=[];saveH();save();renderLobby();
}
let running=false;
async function run(){
 if(running)return;running=true;const my=GEN;
 try{
 while(S){
  save();renderPlayers();
  switch(S.state){
   case 'ROLES':{
    setStatus('全員が自分の役職を確認しています。');
    S.roleSeen??=Array.from({length:S.k||0},(_,i)=>i);
    while(S.k<S.players.length){const chosen=await SessionUI.pick({title:'役職を確認する人',players:S.players.map((p,i)=>({id:i,name:p.name,icon:`<img src="${PORTRAIT(p.portrait||'p_default')}" alt="">`,done:S.roleSeen.includes(i),disabled:S.roleSeen.includes(i)})),confirmIdentity:false,cancel:false});if(chosen==null)continue;const i=Number(chosen);mark(`${P(i).name}さんの役職確認`);await gate(i,'あなたの秘密の役職を確認します。');await roleAlert(i);S.roleSeen.push(i);S.k=S.roleSeen.length;save()}
    S.state='NOMINATION';S.firstNom=true;break;}
   case 'NOMINATION':{
    mark(`${P(S.pres).name}大統領の首相指名`);
    await eventBar('首相の指名');
    setStatus('大統領が首相を指名するのを待っています。');renderPlayers();
    const sel=await selectPrompt({label:'指名',header:`<div>${para(`<span class="highlight">${nm(S.pres)}</span> 大統領、次の首相を指名してください。`)}${S.fas>=3?para('ヒトラーが指名され、首相に選ばれるとファシストの勝利です！','highlight'):''}</div>`,filter:F_TERM,exclude:S.pres});
    S.chan=sel;S.votes={};S.state='VOTING';S.voteBar=true;break;}
   case 'VOTING':{
    renderPlayers();
    if(S.voteBar){await eventBar('投票');S.voteBar=false;save()}
    setStatus('全員の投票を待っています。');renderPlayers();
    if(S.voteMode!=='secret'){mark('投票の入力');const r=await bulkVotePrompt();if(r==null)break;S.votes=r;save();renderPlayers()}
    for(let i=0;i<S.players.length;i++){
     if(!P(i).alive||(i in S.votes))continue;
     mark(`${P(i).name}さんの投票`);await gate(i,'政府への投票を行います。');
     const v=await votingPrompt(i);S.votes[i]=v;save();renderPlayers();
    }
    await showVotes();
    const vals=Object.values(S.votes),y=vals.filter(v=>v).length;
    if(y>vals.length-y){
     if(S.fas>=3&&P(S.chan).role==='H'){S.state='VICTORY';S.winType='FAS_ELECTION';break}
     S.lastPres=S.pres;S.lastChan=S.chan;S.tracker=0;D.tracker=0;updateBoard();
     reshuffleIfNeeded();S.presChoices=S.deck.splice(0,3);S.state='LEG_PRES';S.legBar=true;
    }else{
     S.tracker++;S.state='FAILED';
    }
    break;}
   case 'FAILED':{
    const pos=S.tracker;
    await trackerAlert(pos);
    if(pos>=3){D.tracker=3;updateBoard();await chaos()}
    else{D.tracker=pos;updateBoard();advancePres()}
    break;}
   case 'LEG_PRES':{
    if(S.legBar){await eventBar('立法会議');S.legBar=false;save()}
    setStatus('大統領が捨てる政策を選ぶのを待っています。');renderPlayers();
    await syncDecks();
    mark(`${P(S.pres).name}大統領の政策選択`);await gate(S.pres,'山札から引いた3枚の政策から、捨てる1枚を選びます。');
    const k=await presPrompt(S.presChoices);
    S.discard.push(S.presChoices[k]);S.chanChoices=S.presChoices.filter((_,j)=>j!==k);S.presChoices=null;S.state='LEG_CHAN';save();
    await syncDecks();break;}
   case 'LEG_CHAN':{
    setStatus('首相が制定する政策を選ぶのを待っています。');renderPlayers();
    mark(`${P(S.chan).name}首相の政策制定`);await gate(S.chan,'大統領から渡された2枚の政策から、制定する1枚を選びます。');
    const r=await chanPrompt(S.chanChoices,S.fas===5&&!S.vetoOccurred);
    if(r.veto){S.vetoOccurred=true;S.state='VETO';break}
    const card=S.chanChoices[r.enact];S.discard.push(S.chanChoices[1-r.enact]);
    await enact(card,false);break;}
   case 'VETO':{
    mark('拒否権の判断');sfx.gem();
    setStatus('首相が拒否権を提案しました。大統領の判断を待っています。');renderPlayers();
    const ok=await vetoPrompt();
    if(ok){S.discard.push(...S.chanChoices);S.chanChoices=null;S.tracker++;reshuffleIfNeeded();save();await syncDecks();
     const pos=S.tracker;await trackerAlert(pos);
     if(pos>=3){D.tracker=3;updateBoard();await chaos()}else{D.tracker=pos;updateBoard();advancePres()}}
    else{S.state='LEG_CHAN';snack('大統領は拒否権を却下しました。')}
    break;}
   case 'PP_PEEK':{
    mark('上3枚の確認');
    await eventBar('大統領権限');setStatus('上3枚の確認：大統領が次の3枚の政策を確認しています。');renderPlayers();
    await gate(S.pres,'山札の上から3枚の政策を確認します。');
    setTimeout(sfx.reveal,600*SPEED());await okPrompt({label:'上3枚の確認',header:para('山札の次の3枚の政策です。'),body:policyDisplay(S.deck.slice(0,3),false),delay:500});
    S.state='POST';S.lastState='PP_PEEK';break;}
   case 'PP_INV':{
    mark(S.target==null?'所属の調査':'調査結果の確認');
    if(S.target==null){
     await eventBar('大統領権限');setStatus('調査：大統領が調査する人を選んでいます。');renderPlayers();
     const t=await selectPrompt({label:'所属の調査',header:para(`<span class="highlight">${nm(S.pres)}</span> 大統領、プレイヤーを1人選び、所属政党を調査してください。ファシスト党かリベラル党かは分かりますが、具体的な役職（ヒトラーなど）は分かりません。`)+para('一度調査されたプレイヤーは、再び調査できません。')+para('（調査結果について嘘をついても構いません！）','highlight'),filter:F_INV,exclude:S.pres});
     S.target=t;P(t).inv=true;save();
    }
    const t=S.target;
    await gate(S.pres,`${nm(t)} さんの所属を確認します。`);
    await investigationAlert(t);
    await okPrompt({label:'調査結果',body:playerDisplay({players:[t],showLabels:false,viewer:null}),footer:para(`${nm(t)} は ${nm(S.pres)} 大統領に調査されました。大統領は ${nm(t)} の所属を知っています。`),button:'OK'});
    S.target=null;S.state='POST';break;}
   case 'PP_SE':{
    mark('特別選挙');

    const t=await selectPrompt({label:'特別選挙',header:para(`<span class="highlight">${nm(S.pres)}</span> 大統領、次の大統領にするプレイヤーを選んでください。その任期が終わると、通常の順番に戻ります。`),filter:F_EXEC,exclude:S.pres});
    S.seNext=t;save();

    S.state='POST';break;}
   case 'PP_EXEC':{
    mark('処刑');
    await eventBar('大統領権限');setStatus('処刑：大統領が処刑する人を選んでいます。');renderPlayers();
    const t=await selectPrompt({label:'処刑',header:para(`<span class="highlight">${nm(S.pres)}</span> 大統領、処刑するプレイヤーを選んでください。処刑されたプレイヤーは、発言・投票・立候補ができなくなります。`)+para('ヒトラーが処刑されるとゲームが終わり、リベラルの勝利です。','highlight'),filter:F_EXEC,exclude:S.pres});

  }

 }finally{if(my===GEN)running=false}

   <div class="row" style="justify-content:space-between"><p id="lobby-player-count-text">プレイヤー (${n}/10)</p>
    <div><button id="minusBtn" style="margin:10px 6px;min-width:3em" ${n<=5?'disabled':''}>−</button><button id="plusBtn" style="margin:10px 6px;min-width:3em" ${n>=10?'disabled':''}>＋</button></div></div>
   <div id="lobby-name-list">${L.players.map((p,i)=>`<div class="lobby-name-row"><span class="lobby-num">${i+1}</span><img src="${PORTRAIT(p.icon)}" data-ic="${i}" class="lobby-icon" alt=""><input data-nm="${i}" maxlength="12" value="${esc(p.name||'')}" placeholder="プレイヤー${i+1}" autocomplete="off" enterkeyhint="next"></div>`).join('')}</div>
   <div class="vote-mode"><span>投票方法</span><div class="seg"><button data-vm="open" class="${L.vote==='secret'?'':'on'}">まとめて入力</button><button data-vm="secret" class="${L.vote==='secret'?'on':''}">端末を回す</button></div><small>${L.vote==='secret'?'1人ずつ端末を回して秘密に投票します。':'全員で一斉に示した票を、1台でまとめて入力します。'}</small></div>
   <div class="lobby-buttons">
    <button id="startBtn">ゲーム開始</button>
    <button id="rulesBtn">遊び方</button>
   </div>
   <p style="margin:4px 0"><a data-act="snd" class="sndlbl">${muted?'音：OFF':'音：ON'}</a></p>
   <div id="lobby-text-container">
    <p id="lobby-about-text" style="font-weight:500">Secret Hitler Online</p>
    <p style="font-weight:500;font-size:calc(9px + 1vmin)">原作ボードゲーム「Secret Hitler」© Goat, Wolf, &amp; Cabbage。Secret Hitler Online © ShrimpCryptid。いずれも CC BY-NC-SA 4.0 に基づき使用しています。画像はインターネット経由で読み込みます。</p>
   </div>
  </div>
 </div>`;
 const ins=[...document.querySelectorAll('[data-nm]')];
 ins.forEach((el,i)=>{el.oninput=()=>{L.players[i].name=el.value;saveL()};
  el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();if(ins[i+1])ins[i+1].focus();else el.blur()}})});
 document.querySelectorAll('[data-ic]').forEach(el=>el.onclick=()=>iconSelect(+el.dataset.ic));
 $('#plusBtn').onclick=()=>{if(L.players.length>=10)return;L.players.push({name:'',icon:freeIcon()});saveL();renderLobby();const a=document.querySelectorAll('[data-nm]');a[a.length-1].focus()};
 $('#minusBtn').onclick=()=>{if(L.players.length<=5)return;L.players.pop();saveL();renderLobby()};
 $('#startBtn').onclick=()=>{sfx.flip();const nm=lobbyNames(),orig=L.players.map(p=>p.name);L.players.forEach((p,i)=>p.name=nm[i]);newGame();L.players.forEach((p,i)=>p.name=orig[i]);saveL();statusText='---';renderGame();run()};
 $('#rulesBtn').onclick=rules;
 document.querySelectorAll('[data-vm]').forEach(b=>b.onclick=()=>{L.vote=b.dataset.vm;saveL();renderLobby()});
}
function iconSelect(i){
 const draw=box=>{const used=new Set(L.players.filter((_,j)=>j!==i).map(p=>p.icon));
  box.querySelector('.icon-grid').innerHTML=ALL_ICONS.map(k=>`<img src="${PORTRAIT(k)}" data-ic="${k}" class="${used.has(k)?'taken':'selectable'+(L.players[i].icon===k?' selected':'')}" alt="">`).join('');
  box.querySelectorAll('[data-ic]').forEach(el=>el.onclick=()=>{if(el.classList.contains('taken'))return;L.players[i].icon=el.dataset.ic;saveL();draw(box)})};
 showAlert(buttonPrompt({label:'アイコンを選ぶ',header:para(`${esc(L.players[i].name)} さんのアイコンを選んでください。`),body:'<div class="icon-grid"></div>',buttons:'<button data-ok>確定</button>'}),(box,close)=>{draw(box);box.querySelector('[data-ok]').onclick=()=>close(true,500)},500).then(renderLobby);
}
function rules(){
 if($('#alert').classList.contains('appear-custom-alert')&&running&&!$('#alert-box').querySelector('.rules'))return snack('いまは表示できません。');
 const prev=$('#alert-box').innerHTML,wasOpen=$('#alert').classList.contains('appear-custom-alert');
 if(wasOpen)return;
 okPrompt({label:'遊び方',body:`<div class="rules">
  <p>プレイヤーはリベラル、ファシスト、そして隠れたヒトラーに分かれます。リベラルは協力して隠れたヒトラーを見つけ出し、ファシストはヒトラーを権力の座に押し上げようとします。</p>
  <h2>勝利条件</h2><p><span class="highlight-blue">リベラル</span>：リベラル政策を5枚制定する／ヒトラーを処刑する。</p><p><span class="highlight">ファシスト</span>：ファシスト政策を6枚制定する／ファシスト政策3枚以降にヒトラーを首相に選ぶ。</p>
  <h2>ラウンドの流れ</h2><p>① 大統領が首相を指名（前回の首相と、生存者6人以上なら前回の大統領は指名不可）。</p><p>② 生きている全員が Ja!/Nein で投票。過半数の Ja! で可決。否決なら選挙トラッカーが進み、3回で山札の一番上が強制的に制定されます。</p><p>③ 大統領が3枚引いて1枚捨て、首相が2枚から1枚を制定します。</p><p>④ ファシスト政策の枠に大統領権限があれば発動します（上3枚の確認・所属の調査・特別選挙・処刑）。ファシスト政策5枚以降は拒否権が使えます。</p><p>⑤ 大統領が「任期終了」を押すと次のラウンドへ。</p>
  <h2>1台版について</h2><p>秘密の操作（役職・投票・立法・調査・確認）の前には「端末を渡してください」と表示されます。本人以外は画面を見ないでください。</p>
  <p style="font-size:calc(9px + 1vmin)">原作「Secret Hitler」© Goat, Wolf, &amp; Cabbage／Secret Hitler Online © ShrimpCryptid（CC BY-NC-SA 4.0）。この版は非営利の翻案で、原作者とは関係ありません。</p></div>`,button:'閉じる',delay:500});
}
async function myRole(){
 if($('#alert').classList.contains('appear-custom-alert'))return;
 if(!S||S.state==='ROLES')return;
 const sel=await selectPrompt({label:'役職の確認',header:para('自分の役職を確認する人を選んでください。'),filter:F_NONE,buttonText:'確定'});
 await gate(sel,'自分の役職をもう一度確認します。');await roleAlert(sel);
}
function confirmBack(t){
 return new Promise(res=>{const d=$('#bk');
  d.innerHTML=`<div class="box"><h2>ひとつ前に戻りますか？</h2><p>${t.lobby?'ゲームを中断して<span class="highlight">ロビー</span>に戻ります。役職は配り直しになります。':`<span class="highlight">${esc(t.label)}</span> からやり直します。それ以降の操作は取り消されます。`}</p><div><button data-n>キャンセル</button><button data-y>戻る</button></div></div>`;
  d.classList.add('open');const end=v=>{d.classList.remove('open');d.innerHTML='';res(v)};
  d.querySelector('[data-y]').onclick=()=>end(true);d.querySelector('[data-n]').onclick=()=>end(false);d.onclick=e=>{if(e.target===d)end(false)};
 });
}
let backBusy=false;
async function goBack(){
 if(backBusy)return;const t0=backTarget();if(!t0)return;backBusy=true;
 try{
  if(!await confirmBack(t0))return;const t=backTarget();if(!t)return;
  GEN++;running=false;endTermResolve=null;votesShown=-1;
  setAlertCls('');$('#alert-box').innerHTML='';['#event-bar','#bar-background','#event-bar-text'].forEach(s=>{$(s).className='start-eventbar'});
  while(H.length&&topH()!==t)H.pop();
  if(t.lobby){S=null;H=[];saveH();save();renderLobby();snack('ロビーに戻りました');return}
  S=JSON.parse(JSON.stringify(t.g));D={lib:S.lib,fas:S.fas,tracker:S.tracker,draw:S.deck.length,discard:S.discard.length};
  if(S.pendingEnact){D.lib=S.lib-(S.pendingEnact==='L'?1:0);D.fas=S.fas-(S.pendingEnact==='F'?1:0)}
  saveH();save();statusText='---';renderGame();window.scrollTo(0,0);snack('ひとつ前に戻りました');
  if(S.pendingEnact)await showEnact();run();
 }finally{backBusy=false}
}
document.addEventListener('click',e=>{
 const el=e.target.closest('button:not(:disabled),[data-pick],[data-v],.selectable,.lobby-icon,a[data-act],a[data-back]');
 if(el&&!el.closest('#bk')||el&&el.matches('#bk [data-n]'))sfx.tap();
 if(e.target.closest('[data-back]')){e.preventDefault();e.stopPropagation();goBack()}
},true);
document.addEventListener('click',async e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
 if(act==='snd'){muted=!muted;try{localStorage.setItem('sho-ja.muted',muted?'1':'0')}catch(e){};document.querySelectorAll('.sndlbl').forEach(x=>x.textContent=muted?'音：OFF':'音：ON');snack(muted?'効果音・振動をオフにしました':'効果音・振動をオンにしました');if(!muted)sfx.pass();return}
 if(act==='rules')rules();
 if(act==='myrole')myRole();
 if(act==='quit'){if($('#alert').classList.contains('appear-custom-alert'))return;
  const ok=await showAlert(buttonPrompt({label:'ゲームをやめる',header:para('進行中のゲームを終了してロビーに戻りますか？'),buttons:'<button data-no>キャンセル</button><button data-yes>やめる</button>'}),(box,close)=>{box.querySelector('[data-no]').onclick=()=>close(false,500);box.querySelector('[data-yes]').onclick=()=>close(true,500)},500);
  if(ok){H=[];saveH();S=null;save();location.reload()}}
});

/* ---------------- accidental reload protection ---------------- */
const gameInProgress=()=>!!S&&S.state!=='VICTORY';
// Browsers own their toolbar/OS controls. Request a native confirmation when supported.
window.addEventListener('beforeunload',e=>{
 if(!gameInProgress())return;
 e.preventDefault();e.returnValue='';
});
window.addEventListener('keydown',e=>{
 if(gameInProgress()&&(e.key==='F5'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='r'))){
  e.preventDefault();snack('ゲーム中の再読み込みを防止しました');
 }
});
// Fallback for mobile browsers that ignore overscroll-behavior on the viewport.
// Block only downward boundary drags; allow inner modal and page scrolling.
let reloadTouch=null;
document.addEventListener('touchstart',e=>{
 reloadTouch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;
},{passive:true});
document.addEventListener('touchmove',e=>{
 if(!gameInProgress()||!reloadTouch||e.touches.length!==1)return;
 const t=e.touches[0],dy=t.clientY-reloadTouch.y,dx=t.clientX-reloadTouch.x;
 reloadTouch={x:t.clientX,y:t.clientY};
 if(dy<=0||dy<=Math.abs(dx))return;
 const path=e.composedPath?e.composedPath():[];
 const canScrollUp=path.some(el=>el instanceof Element&&
  el.scrollHeight>el.clientHeight+1&&el.scrollTop>0&&
  /^(auto|scroll|overlay)$/.test(getComputedStyle(el).overflowY));
 if(!canScrollUp&&(document.scrollingElement?.scrollTop||0)<=0&&e.cancelable)e.preventDefault();
},{passive:false});
const endReloadTouch=()=>{reloadTouch=null};
document.addEventListener('touchend',endReloadTouch,{passive:true});
document.addEventListener('touchcancel',endReloadTouch,{passive:true});

/* ---------------- boot ---------------- */
let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
renderLobby();
if(saved&&saved.players&&saved.state&&saved.state!=='VICTORY'){
 showAlert(buttonPrompt({label:'前回のゲーム',header:para(`${saved.players.length}人のゲームが途中で残っています（リベラル${saved.lib}枚／ファシスト${saved.fas}枚）。続きから遊びますか？`),buttons:'<button data-no>破棄</button><button data-yes>続ける</button>'}),(box,close)=>{
  box.querySelector('[data-no]').onclick=()=>close(false,500);box.querySelector('[data-yes]').onclick=()=>close(true,500)},500).then(async ok=>{
  if(!ok){localStorage.removeItem(KEY);localStorage.removeItem(HKEY);return}
  S=saved;try{const hh=JSON.parse(localStorage.getItem(HKEY)||'[]');if(Array.isArray(hh))H=hh}catch(e){};D={lib:S.lib,fas:S.fas,tracker:S.tracker,draw:S.deck.length,discard:S.discard.length};
  if(S.pendingEnact){D.lib=S.lib-(S.pendingEnact==='L'?1:0);D.fas=S.fas-(S.pendingEnact==='F'?1:0)}
  statusText='---';renderGame();if(S.pendingEnact)await showEnact();run();
 });
}
window.__sh={sfx,get H(){return H},back:goBack,get S(){return S},get running(){return running},L,roleAlert,playerDisplay,F_NONE};
})();
</script>

kground-size:300% 300%;background-position:var(--ui-material-position);border:1px solid var(--ui-button-line);color:#ffedc7;letter-spacing:.24em} .session-dialog{--ui-panel:#171614;--ui-ink:#f6eddb;--ui-muted:#d0c5af;--ui-line:#71604c;--ui-accent:#e05b2b;--control-radius:10px;--paper-radius:12px;color:#f6eddb;background:#171614;border:1px solid #71604c;font-family:'M PLUS 1p',sans-serif;box-sizing:border-box}.session-dialog *{font-family:inherit}.session-dialog[open]{position:fixed;inset:auto;top:calc(var(--visible-top,0px) + var(--visible-h,100dvh)/2);left:50%;transform:translate(-50%,-50%);margin:0;max-width:calc(100vw - 32px);max-height:calc(var(--visible-h,100dvh) - 32px);overflow:auto}.session-dialog::backdrop{background:#141414cc}.session-dialog button{margin:0!important;font-size:16px;box-shadow:none}.session-dialog .session-seat{background:#27231e!important;color:#f6eddb!important;border-color:#71604c!important}.session-dialog h2{font-family:inherit;color:#f6eddb;font-style:normal;font-size:22px}.session-dialog p,.session-dialog small{color:#d0c5af!important}.session-dialog .session-seat-copy{text-align:left}.session-dialog .session-close{background:#e05b2b;color:white}.session-dialog .session-chevron{color:#efb36f}@media(min-width:700px){.session-dialog:has(.session-roster){width:620px}.session-dialog .session-roster{grid-template-columns:repeat(2,minmax(0,1fr))}}.session-dialog .session-close{font-size:24px!important}</style></body>
